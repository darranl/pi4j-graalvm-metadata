name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to a version tag rather than a digest. graalvm-pi-builder is a first-party image
  # we control; retagging bookworm-25.3.4.1 would be an intentional act. Digest pinning adds
  # maintenance burden (every image rebuild produces a new digest) for negligible benefit here.
  GRAALVM_PI_BUILDER_IMAGE: ghcr.io/lofthouse-dev/graalvm-pi-builder:bookworm-25.3.4.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Set up graalvm-pi-builder container
        uses: ./.github/actions/setup-graalvm-pi-builder
        with:
          image: ${{ env.GRAALVM_PI_BUILDER_IMAGE }}

      - name: Build
        run: mvn --batch-mode package
