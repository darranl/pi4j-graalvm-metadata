name: Metadata drift

# Regenerates the captured metadata on the pinned graalvm-pi-builder image and compares it with
# the metadata in the latest release. Also reports newer Pi4J and graalvm-pi-builder versions.
# Report-only: it never releases anything (releases are manual, see RELEASING.md).
on:
  workflow_dispatch:
    inputs:
      open_issue:
        description: "Create/update/close the tracking issue from this manual run"
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  pull_request:
    branches: [main]
    paths:
      - graalvm-pi-builder.env
      - pom.xml
      - probe/**
      - scripts/*-metadata.sh
      - scripts/check-updates.sh
      - scripts/update-tracking-issue.sh
      - .github/workflows/metadata-drift.yml

concurrency:
  group: metadata-drift-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the latest release is the highest version tag

      - name: Select graalvm-pi-builder image
        # graalvm-pi-builder.env is the single place the image tag is pinned.
        # Comment lines are not valid in $GITHUB_ENV, so append only the KEY=value lines.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' graalvm-pi-builder.env >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Set up graalvm-pi-builder container
        uses: ./.github/actions/setup-graalvm-pi-builder
        with:
          image: ${{ env.GRAALVM_PI_BUILDER_IMAGE }}

      - name: Generate the metadata
        run: mvn --batch-mode package

      - name: Fetch the metadata of the latest release
        id: released
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p drift
          version="$(scripts/fetch-released-metadata.sh drift/released.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          cp metadata/target/generated-resources/META-INF/native-image/com.pi4j/pi4j-plugin-ffm/reachability-metadata.json \
            drift/generated.json

      - name: Compare with the latest release
        id: compare
        run: |
          # Record the outcome instead of failing here, so the report and the tracking issue are
          # still produced; the last step fails the run when the content differs.
          set +e
          scripts/compare-metadata.sh drift/released.json drift/generated.json > drift/compare.txt
          status=$?
          set -e
          cat drift/compare.txt
          if [ "$status" -eq 0 ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::compare-metadata.sh failed with status $status"
            exit "$status"
          fi

      - name: Check for newer versions
        id: updates
        run: |
          scripts/check-updates.sh > drift/updates.txt
          cat drift/updates.txt
          if [ -s drift/updates.txt ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the report
        id: report
        run: |
          {
            echo "## Metadata drift report"
            echo
            echo "- Latest release: \`${{ steps.released.outputs.version }}\`"
            echo "- Builder image: \`${GRAALVM_PI_BUILDER_IMAGE}\`"
            echo
            echo "### Comparison with the latest release"
            echo
            echo '```'
            cat drift/compare.txt
            echo '```'
            echo
            echo "### Newer versions"
            echo
            if [ -s drift/updates.txt ]; then
              cat drift/updates.txt
            else
              echo "None: Pi4J and graalvm-pi-builder are current."
            fi
          } > drift/report.md
          cat drift/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the files and diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-drift
          path: drift/
          if-no-files-found: ignore

      - name: Update the tracking issue
        # Only scheduled runs and manual runs that ask for it; never pull requests.
        if: steps.report.conclusion == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.open_issue))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/update-tracking-issue.sh \
            "${{ steps.compare.outputs.drift }}" \
            "${{ steps.updates.outputs.updates }}" \
            drift/report.md \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail if the metadata differs
        if: steps.compare.outputs.drift == 'true'
        run: |
          echo "::error::The captured metadata differs from release ${{ steps.released.outputs.version }}; a new metadata release is needed (see RELEASING.md)."
          exit 1
