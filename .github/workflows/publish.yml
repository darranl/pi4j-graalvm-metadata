name: Publish

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select graalvm-pi-builder image
        # graalvm-pi-builder.env is the single place the image tag is pinned.
        # Comment lines are not valid in $GITHUB_ENV, so append only the KEY=value lines.
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' graalvm-pi-builder.env >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Java 25 (with GitHub Packages auth)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Set up graalvm-pi-builder container
        uses: ./.github/actions/setup-graalvm-pi-builder
        with:
          image: ${{ env.GRAALVM_PI_BUILDER_IMAGE }}

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
